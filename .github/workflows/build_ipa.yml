name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project AIStockApp.xcodeproj \
            -scheme AIStockApp \
            -configuration Release \
            -archivePath ./build/AIStockApp.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ./build/AIStockApp.xcarchive/Products/Applications/AIStockApp.app Payload/
          zip -r AIStockApp_unsigned.ipa Payload
          ls -lh AIStockApp_unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStockApp-IPA
          path: AIStockApp_unsigned.ipa
